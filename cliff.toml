# git-cliff configuration for generating CHANGELOG.md from Conventional Commits.
# Usage:
#   git-cliff --tag v1.0.0 -o CHANGELOG.md     # full history
#   git-cliff --unreleased --tag v1.0.0 --prepend CHANGELOG.md
# Chart releases are tagged `v<version>`. Keep a Changelog style, grouped by change type.

[changelog]
header = """
# Changelog

All notable changes to the **WProofreader** Helm chart are documented here.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this
chart adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Map commit types to Keep a Changelog sections; drop noise.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
]
filter_commits = true
# Only this chart's release tags.
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
