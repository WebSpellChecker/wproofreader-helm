{{- if and (or .Values.database.enabled .Values.databaseProvisioning.enabled) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wproofreader.dbSecretName" . | quote }}
  labels:
    {{- include "wproofreader.labels" . | nindent 4 }}
  annotations:
    # Always a pre-install/pre-upgrade hook, in both modes:
    #  - with provisioning on, the db-manager Job (weight 0) needs this Secret (weight -10)
    #    before any regular release resource exists;
    #  - keeping it a hook with provisioning off too means toggling
    #    databaseProvisioning.enabled never moves the Secret between "hook" and "release
    #    resource" (Helm refuses to adopt an existing hook resource: invalid ownership metadata).
    # before-hook-creation only (no hook-succeeded) so it persists for the WProofreader
    # Deployment to reference. Hook resources are not removed by `helm uninstall`.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- if or .Values.database.enabled .Values.databaseProvisioning.provisionPredefinedUsers }}
  appserver-password: {{ required "database.appServerPassword is required when database.enabled or databaseProvisioning.provisionPredefinedUsers is true (or provide database.existingSecret)" .Values.database.appServerPassword | quote }}
  {{- end }}
  {{- if .Values.databaseProvisioning.enabled }}
  root-password: {{ required "databaseProvisioning.rootPassword is required when databaseProvisioning.enabled (or provide database.existingSecret)" .Values.databaseProvisioning.rootPassword | quote }}
  {{- if .Values.databaseProvisioning.provisionPredefinedUsers }}
  # db-manager refuses to provision predefined users without APP_MANAGER_PASSWORD,
  # so fail at render time rather than inside the hook Job.
  app-manager-password: {{ required "databaseProvisioning.appManagerPassword is required when databaseProvisioning.provisionPredefinedUsers is true (or provide database.existingSecret)" .Values.databaseProvisioning.appManagerPassword | quote }}
  {{- else }}
  {{- with .Values.databaseProvisioning.appManagerPassword }}
  app-manager-password: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
