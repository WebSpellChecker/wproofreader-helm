name: Release chart

# Release flow (see "Release a new chart version" in CONTRIBUTING.md):
# - Pull requests go to development and are merged with "Squash and merge".
# - The pull request from development to main is the release.
#   prepare: on each update of that pull request, git-cliff selects the next version from the
#   Conventional Commits that change wproofreader/ since the last v<version> tag. The job commits
#   "chore(release): <version>" with the chart version and the changelog to development,
#   validates the chart, and sets the commit status "release-ready" on that commit.
# - publish: the merge of that pull request into main (a merge commit) creates the tag, the
#   GitHub Release with the chart package, and the Helm repository index on gh-pages. Then it
#   brings development up to main. A push to main that is not such a merge publishes nothing.
#   Each publish step skips work that is already done, so a failed run can be re-run.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CHART: wproofreader
  GIT_CLIFF_VERSION: "2.14.2"

jobs:
  prepare:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'development' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # commit the release files to development
      statuses: write       # the release-ready status
      pull-requests: write  # the title and the description of the release pull request
    concurrency:
      group: release-prepare-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Check the state of development
        id: state
        run: |
          # The commit of the event, or the release commit that an earlier run of this event added.
          if [ "$(git rev-parse HEAD)" = "${HEAD_SHA}" ]; then
            current=true
          elif [ "$(git rev-parse HEAD~1)" = "${HEAD_SHA}" ] \
            && git log -1 --format=%s HEAD | grep -q '^chore(release)'; then
            current=true
          else
            current=false
            echo "development moved after this event; the run of the newer commit prepares the release."
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          [ "${current}" = true ] || exit 0
          # The publish job brings each release into development. Without it, git-cliff would
          # count the commits of the last release again.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "error: development does not contain main. Re-run the publish job of the last release," >&2
            echo "or merge main into development with a merge commit." >&2
            exit 1
          fi

      - name: Install git-cliff
        if: steps.state.outputs.current == 'true'
        run: pip install --quiet "git-cliff==${GIT_CLIFF_VERSION}"

      - name: Set the chart version and write the changelog
        id: prepare
        if: steps.state.outputs.current == 'true'
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          last=${last_tag#v}
          next=$(git-cliff --include-path "${CHART}/**" --bumped-version 2>/dev/null)
          next=${next#v}
          if ! [[ "${next}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: git-cliff returned the version '${next}'" >&2
            exit 1
          fi
          if [ "${next}" = "${last}" ]; then
            # Nothing to release: the chart version and the changelog stay at the last release.
            version=${last}
            result=none
            : > "${RUNNER_TEMP}/section.md"
          else
            version=${next}
            result=${next}
            git-cliff --include-path "${CHART}/**" --unreleased --tag "v${next}" --strip all \
              2>/dev/null > "${RUNNER_TEMP}/section.md"
          fi
          # Remove each section of a version above the last release, so that a new run replaces
          # the section of the unreleased version. Keep the date of a section for the same version.
          python3 - "${CHART}/CHANGELOG.md" "${RUNNER_TEMP}/section.md" "${last}" "${version}" \
            > "${RUNNER_TEMP}/CHANGELOG.md" <<'EOF'
          import re, sys
          path, section_path, last, version = sys.argv[1:]
          key = lambda v: tuple(int(x) for x in v.split("."))
          heading = re.compile(r"^## \[(\d+\.\d+\.\d+)\]\([^)]*\) - ([0-9-]+)$|^## Unreleased$")
          out, keep, old_date = [], True, ""
          for line in open(path).read().splitlines(keepends=True):
              m = heading.match(line.rstrip("\n"))
              if m:
                  if m.group(1) == version and version != last:
                      old_date = m.group(2)
                  keep = m.group(1) is not None and key(m.group(1)) <= key(last)
              if keep:
                  out.append(line)
          section = open(section_path).read().strip("\n")
          if section:
              if old_date:
                  section = re.sub(r"(?m)^(## \[[^]]+\]\([^)]*\)) - [0-9-]+$", r"\1 - " + old_date, section, count=1)
              at = next((i for i, line in enumerate(out) if line.startswith("## ")), len(out))
              out = out[:at] + [section + "\n\n"] + out[at:]
          sys.stdout.write(re.sub(r"\n{3,}", "\n\n", "".join(out)).rstrip("\n") + "\n")
          EOF
          cp "${RUNNER_TEMP}/CHANGELOG.md" "${CHART}/CHANGELOG.md"
          sed -i "s/^version: .*/version: ${version}/" "${CHART}/Chart.yaml"
          echo "Last release ${last}; to release: ${result}"
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Commit the release files to development
        id: commit
        if: steps.state.outputs.current == 'true'
        env:
          RESULT: ${{ steps.prepare.outputs.result }}
        run: |
          if git diff --quiet; then
            echo "The release files are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${RESULT}" = none ]; then
              git commit --quiet --all -m "chore(release): no chart release"
            else
              git commit --quiet --all -m "chore(release): ${RESULT}"
            fi
            git push --quiet origin HEAD:refs/heads/development
            echo "Committed $(git log -1 --format='%h %s')"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        if: steps.state.outputs.current == 'true'

      - uses: actions/setup-go@v7
        if: steps.state.outputs.current == 'true'
        with:
          go-version: "1.26.x"
          cache: false

      - name: Validate the chart
        if: steps.state.outputs.current == 'true'
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          gopath=$(go env GOPATH)
          export PATH="${gopath}/bin:${PATH}"
          make check

      - name: Update the title and the description of the release pull request
        if: steps.state.outputs.current == 'true'
        env:
          RESULT: ${{ steps.prepare.outputs.result }}
          LAST: ${{ steps.prepare.outputs.last }}
        run: |
          body="${RUNNER_TEMP}/body.md"
          if [ "${RESULT}" = none ]; then
            title="chore: bring the changes of development to main (no chart release)"
            printf '%s\n' "No change of the packaged chart since v${LAST}: the merge publishes no release." > "${body}"
          else
            title="chore(release): ${RESULT}"
            awk -v heading="## [${RESULT}]" \
              'index($0, heading) == 1 {found = 1; next} found && /^## /{exit} found' \
              "${CHART}/CHANGELOG.md" | sed '/./,$!d' > "${body}"
            printf '\n%s\n' "Merge with a merge commit to publish ${RESULT}." >> "${body}"
          fi
          gh pr edit "${PR_NUMBER}" --title "${title}" --body-file "${body}"

      - name: Set the release-ready status
        if: always() && steps.state.outputs.current == 'true'
        env:
          RESULT: ${{ steps.prepare.outputs.result }}
          SHA: ${{ steps.commit.outputs.sha || github.event.pull_request.head.sha }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "${OUTCOME}" != success ]; then
            state=failure
            description="Preparing the release failed; see the workflow run"
          elif [ "${RESULT}" = none ]; then
            state=success
            description="No chart change: the merge publishes no release"
          else
            state=success
            description="Release ${RESULT} is prepared and validated"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" -f context=release-ready -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # the tag, the release, gh-pages, and development
      pull-requests: read   # find the pull request of the merge commit
    concurrency:
      group: chart-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the release pull request of this commit
        id: release
        run: |
          # An API error must stop the job: its output is not a pull request number.
          if ! prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq \
            ".[] | select(.merged_at != null and .base.ref == \"main\" and .head.ref == \"development\"
              and .head.repo.full_name == \"${GITHUB_REPOSITORY}\" and .merge_commit_sha == \"${GITHUB_SHA}\") | .number"); then
            echo "error: cannot list the pull requests of ${GITHUB_SHA}" >&2
            exit 1
          fi
          pr=$(printf '%s\n' "${prs}" | head -n 1)
          if [ -n "${pr}" ] && ! [[ "${pr}" =~ ^[0-9]+$ ]]; then
            echo "error: unexpected answer of the pull request lookup" >&2
            exit 1
          fi
          if [ -z "${pr}" ]; then
            echo "This push is not the merge of a pull request from development: nothing to publish."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Main must have the tree that the pull request checked (its second parent).
          if [ "$(git rev-parse "${GITHUB_SHA}^{tree}")" != "$(git rev-parse "${GITHUB_SHA}^2^{tree}")" ]; then
            echo "error: the merge commit differs from the head of pull request #${pr}" >&2
            exit 1
          fi
          version=$(awk '/^version:/ {print $2; exit}' "${CHART}/Chart.yaml")
          tag_commit=$(git rev-parse --quiet --verify "refs/tags/v${version}^{commit}" || true)
          if [ -z "${tag_commit}" ] || [ "${tag_commit}" = "${GITHUB_SHA}" ]; then
            publish=true
            echo "Pull request #${pr}: publish ${version}"
          else
            publish=false
            echo "Pull request #${pr}: v${version} is already released; nothing to publish."
          fi
          {
            echo "merged=true"
            echo "publish=${publish}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        if: steps.release.outputs.publish == 'true'

      - uses: actions/setup-go@v7
        if: steps.release.outputs.publish == 'true'
        with:
          go-version: "1.26.x"
          cache: false

      - name: Validate the chart
        if: steps.release.outputs.publish == 'true'
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          gopath=$(go env GOPATH)
          export PATH="${gopath}/bin:${PATH}"
          make check

      - name: Create the tag and the GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Release notes: the section of this version in the changelog, without its heading.
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${VERSION}]" \
            'index($0, heading) == 1 {found = 1; next} found && /^## /{exit} found' \
            "${CHART}/CHANGELOG.md" | sed '/./,$!d' > "${notes}"
          if [ ! -s "${notes}" ]; then
            echo "error: ${CHART}/CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          if ! git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag "v${VERSION}" "${GITHUB_SHA}"
            git push origin "v${VERSION}"
          fi
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "${notes}" --verify-tag
          fi

      - name: Attach the chart package to the release
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package="${CHART}-${VERSION}.tgz"
          mkdir -p dist
          # helm package is not byte-reproducible: a re-run uses the package that is already
          # published instead of replacing it.
          if gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -qx "${package}"; then
            gh release download "v${VERSION}" --pattern "${package}" --dir dist --clobber
            echo "The release already has ${package}; the index uses it."
          else
            helm package "${CHART}" --destination dist
            gh release upload "v${VERSION}" "dist/${package}"
          fi
          sha256sum "dist/${package}"

      - name: Add the package to the Helm repository index on gh-pages
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../gh-pages origin/gh-pages
          helm repo index dist \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" \
            --merge ../gh-pages/index.yaml
          cp dist/index.yaml ../gh-pages/index.yaml
          cd ../gh-pages
          git add index.yaml
          if git diff --cached --quiet; then
            echo "index.yaml already has v${VERSION}."
          else
            git commit -m "chore: add v${VERSION} to the Helm repository index"
            git push origin HEAD:gh-pages
          fi

      - name: Check that users can install the release
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          curl -fsSL -o /dev/null \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${CHART}-${VERSION}.tgz"
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          # GitHub Pages serves the new index.yaml some time after the push.
          for attempt in $(seq 1 20); do
            if helm repo add release-check "${url}" --force-update >/dev/null 2>&1 \
              && helm search repo "release-check/${CHART}" --version "${VERSION}" | grep -q "${VERSION}"; then
              echo "helm search finds ${CHART} ${VERSION} in ${url}"
              exit 0
            fi
            echo "attempt ${attempt}: ${VERSION} is not in ${url}index.yaml yet"
            sleep 30
          done
          echo "error: ${url}index.yaml does not list ${VERSION}" >&2
          exit 1

      - name: Bring development up to main
        if: steps.release.outputs.merged == 'true'
        run: |
          # Never a force push: a fast-forward, or a merge commit when development has new commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin refs/heads/development
          development=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "${GITHUB_SHA}" "${development}"; then
            echo "development already contains ${GITHUB_SHA}."
          elif git merge-base --is-ancestor "${development}" "${GITHUB_SHA}"; then
            git push --quiet origin "${GITHUB_SHA}:refs/heads/development"
            echo "development fast-forwarded to ${GITHUB_SHA}."
          else
            git checkout --quiet --detach "${development}"
            if ! git merge --quiet --no-ff --no-edit -m "Merge branch 'main' into development" "${GITHUB_SHA}"; then
              git merge --abort || true
              echo "error: merging main into development has a conflict. Merge main into development" >&2
              echo "on a branch, resolve the conflict, merge that branch with a merge commit, and re-run this job." >&2
              exit 1
            fi
            git push --quiet origin HEAD:refs/heads/development
            echo "Merged main into development: $(git rev-parse --short HEAD)."
          fi
