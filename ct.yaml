# chart-testing configuration. See https://github.com/helm/chart-testing#configuration
target-branch: main
# Use chart-dirs, not an explicit charts list: ct skips the version check for listed
# charts. With chart-dirs, ct lints the chart only when it changed against the target
# branch. `make check` validates every scenario in ci/ on every run.
chart-dirs:
  - .
# The maintainer is a team with an email address, not a GitHub user.
validate-maintainers: false
# The release pull request bumps the chart version, not each change.
check-version-increment: false
lint-conf: lintconf.yaml
